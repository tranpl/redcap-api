name: Publish NuGet Package

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-github-packages:
    name: Publish To GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore

      - name: Use the release tag for the package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v?2\.0\.([0-9]+)$ ]]; then
            echo "release_patch=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "Expected a 2.0.x release tag" >&2
            exit 1
          fi

      - name: Build
        run: dotnet build src/RedcapApi/RedcapApi.csproj -c Release --no-restore -p:RedcapBuildPatch="${release_patch:-$GITHUB_RUN_NUMBER}"

      - name: Pack
        run: dotnet pack src/RedcapApi/RedcapApi.csproj -c Release --no-build -o ./artifacts

      - name: Publish To GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
